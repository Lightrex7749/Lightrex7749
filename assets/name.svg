<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Gaurav Rajbhar</title>
  <desc id="desc">Gaurav Rajbhar — AI/ML Engineer and Web Developer</desc>
  <defs>
    <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="45%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="#A855F7" stroke-linecap="round" opacity=".55">
    <path d="M250 42h70M880 42h70" stroke-width="2"/>
    <path d="M285 36v12M915 36v12" stroke-width="2"/>
  </g>
  <text x="600" y="112" text-anchor="middle" fill="url(#name)"
        font-family="Montserrat, Arial, sans-serif" font-size="76"
        font-weight="700" letter-spacing="2" filter="url(#glow)">Gaurav Rajbhar</text>
  <text x="600" y="154" text-anchor="middle" fill="#D8B4FE"
        font-family="Montserrat, Arial, sans-serif" font-size="20"
        font-weight="600" letter-spacing="5">AI/ML ENGINEER · WEB DEVELOPER</text>
  <rect x="330" y="181" width="540" height="3" rx="2" fill="url(#line)"/>
</svg>
